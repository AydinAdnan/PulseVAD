[project]
name = "pulsevad"
version = "0.1.0"
description = "Ultra-tiny streaming VAD (kiloVAD clean-room reimplementation)"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "modal>=1.5.5",
    "numpy>=1.24.0,<2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "pyroomacoustics>=0.7.5",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "torch>=2.1.0",
    "torch-pruning>=1.4.0",
    "torchaudio>=2.1.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulsevad"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
